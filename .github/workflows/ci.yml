name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm_test_migration
          POSTGRES_PASSWORD: crm_test_migration_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm_test_migration -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 11.21.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=crm_test_migration_password psql -h 127.0.0.1 -U crm_test_migration -d crm_test -f scripts/postgres/01-roles.sql
      - run: pnpm db:check
      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgresql://crm_test_migration:crm_test_migration_password@127.0.0.1:5432/crm_test
          DATABASE_URL: postgresql://crm_runtime:crm_runtime_password@127.0.0.1:5432/crm_test
  quality:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm_test_migration
          POSTGRES_PASSWORD: crm_test_migration_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test_migration -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --spider --quiet http://127.0.0.1:8025/api/v1/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create runtime roles
        run: PGPASSWORD=crm_test_migration_password psql -h 127.0.0.1 -U crm_test_migration -d crm_test -f scripts/postgres/01-roles.sql
      - name: Migrate test database
        run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgresql://crm_test_migration:crm_test_migration_password@127.0.0.1:5432/crm_test
      - name: Check format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Immutable actions check
        run: pnpm security:actions
      - name: Supply chain audit and SBOM gate
        run: pnpm security:supply-chain
      - name: RLS audit
        run: pnpm security:rls-audit
        env:
          DATABASE_MIGRATION_URL: postgresql://crm_test_migration:crm_test_migration_password@127.0.0.1:5432/crm_test
          DATABASE_URL: postgresql://crm_runtime:crm_runtime_password@127.0.0.1:5432/crm_test
          DATABASE_WORKER_URL: postgresql://crm_worker:crm_worker_password@127.0.0.1:5432/crm_test
      - name: Unit tests
        run: pnpm test:run
      - name: Security reproduction tests
        env:
          TEST_DATABASE_URL: postgresql://crm_runtime:crm_runtime_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_MIGRATION_URL: postgresql://crm_test_migration:crm_test_migration_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_INGRESS_URL: postgresql://crm_ingress:crm_ingress_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_WORKER_URL: postgresql://crm_worker:crm_worker_password@127.0.0.1:5432/crm_test
        run: pnpm test:security-repro
      - name: Worker queue tests
        env:
          TEST_DATABASE_URL: postgresql://crm_runtime:crm_runtime_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_MIGRATION_URL: postgresql://crm_test_migration:crm_test_migration_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_INGRESS_URL: postgresql://crm_ingress:crm_ingress_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_WORKER_URL: postgresql://crm_worker:crm_worker_password@127.0.0.1:5432/crm_test
        run: pnpm test:worker
      - name: Build
        run: pnpm build
      - name: Build container
        run: docker build --tag crm:ci .
      - name: Build worker container
        run: docker build --file Dockerfile.worker --tag crm-worker:ci .
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          TEST_DATABASE_URL: postgresql://crm_runtime:crm_runtime_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_MIGRATION_URL: postgresql://crm_test_migration:crm_test_migration_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_INGRESS_URL: postgresql://crm_ingress:crm_ingress_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_WORKER_URL: postgresql://crm_worker:crm_worker_password@127.0.0.1:5432/crm_test
        run: pnpm test:e2e
      - name: Privileged MFA end-to-end test
        env:
          TEST_DATABASE_URL: postgresql://crm_runtime:crm_runtime_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_MIGRATION_URL: postgresql://crm_test_migration:crm_test_migration_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_INGRESS_URL: postgresql://crm_ingress:crm_ingress_password@127.0.0.1:5432/crm_test
          TEST_DATABASE_WORKER_URL: postgresql://crm_worker:crm_worker_password@127.0.0.1:5432/crm_test
        run: pnpm test:e2e:mfa
